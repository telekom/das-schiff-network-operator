name: pullrequests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libbpf-dev gcc-multilib linux-headers-$(uname -r)
      - name: run code generators
        run: make generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.8.0
          args: --timeout=10m

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libbpf-dev gcc-multilib linux-headers-$(uname -r)
      - name: Run Tests
        run: make test
      - name: Upload coverage report
        # Note: codecov-action v6 requires the Node.js 24 Actions runtime.
        # GitHub-hosted runners (ubuntu-latest) include node24; self-hosted runners
        # and GHES environments may need to be updated before upgrading to v6.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: cover.out
          fail_ci_if_error: false

  validate-generated:
    name: validate generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libbpf-dev gcc-multilib linux-headers-$(uname -r)
      - name: run code generators
        run: make generate
      - name: run manifest generators
        run: make manifests
      - name: ensure no files changed
        run: git diff --exit-code || (echo "Generated files are out of sync. Please run 'make generate manifests' and commit the updated files."; exit 1)

  build-images:
    name: build container images
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [golangci, test, validate-generated]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-images.yaml
    with:
      push: true
      cache-write: true

  build-images-fork:
    name: build container images (fork)
    if: github.event.pull_request.head.repo.full_name != github.repository
    needs: [golangci, test, validate-generated]
    permissions:
      contents: read
      # packages: write and id-token: write are required because GitHub statically
      # validates reusable workflow job permissions even when those jobs are
      # conditionally skipped. The build and manifest jobs in build-images.yaml
      # declare these permissions for registry push and cosign signing, but neither
      # runs for forks (inputs.push == false). For pull_request triggers from forks,
      # the GITHUB_TOKEN is automatically scoped to read-only by GitHub regardless
      # of what is declared here.
      packages: write
      id-token: write
    uses: ./.github/workflows/build-images.yaml
    with:
      push: false
