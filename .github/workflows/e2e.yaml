name: E2E Tests

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "api/**"
      - "cmd/**"
      - "controllers/**"
      - "pkg/**"
      - "config/**"
      - "e2e/**"
      - "e2etests/**"
      - "go.mod"
      - "go.sum"
      - "bpf/**"
      - "*.Dockerfile"
      - "Makefile"

permissions: {}

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  IMG_BASE: ghcr.io/telekom
  KIND_NODE_VERSION: v1.35.1

jobs:
  # ── Parallel image builds ───────────────────────────────────────────
  build-kind-node:
    name: Build kind-node image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compute ldflags
        id: ldflags
        run: echo "value=$(bash hack/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build cra-frr image
        run: |
          docker build \
            --build-arg ldflags="${{ steps.ldflags.outputs.value }}" \
            -f das-schiff-cra-frr.Dockerfile \
            -t das-schiff-cra-frr:latest .

      - name: Build kind-node image (with cra-frr baked in)
        run: |
          docker save -o e2e/images/kind-node/cra-frr.tar das-schiff-cra-frr:latest
          docker build \
            --build-arg KIND_NODE_VERSION=${{ env.KIND_NODE_VERSION }} \
            -t ${{ env.IMG_BASE }}/das-schiff-kind-node:${{ env.KIND_NODE_VERSION }} \
            -f e2e/images/kind-node/Dockerfile \
            e2e/images/kind-node/
          rm -f e2e/images/kind-node/cra-frr.tar

      - name: Export kind-node tarball
        run: |
          mkdir -p /tmp/e2e-images
          docker save -o /tmp/e2e-images/kind-node.tar \
            "${{ env.IMG_BASE }}/das-schiff-kind-node:${{ env.KIND_NODE_VERSION }}"

      - name: Upload kind-node image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-image-kind-node
          path: /tmp/e2e-images/kind-node.tar
          retention-days: 1
          compression-level: 0 # already compressed by docker save

  build-e2e-images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - das-schiff-network-operator
          - das-schiff-nwop-agent-cra-frr
          - das-schiff-nwop-agent-netplan
          - das-schiff-platform-coil
          - das-schiff-platform-metallb
          - das-schiff-network-sync
          - das-schiff-nwop-cni-workload
          - das-schiff-nwop-vhostuser-device-plugin
          - das-schiff-nwop-kubevirt-vhostuser-hook
          - das-schiff-nwop-agent-cra-grout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compute ldflags
        id: ldflags
        run: echo "value=$(bash hack/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg ldflags="${{ steps.ldflags.outputs.value }}" \
            -f ${{ matrix.image }}.Dockerfile \
            -t ${{ env.IMG_BASE }}/${{ matrix.image }}:latest .

      - name: Export tarball
        run: |
          mkdir -p /tmp/e2e-images
          docker save -o /tmp/e2e-images/${{ matrix.image }}.tar \
            "${{ env.IMG_BASE }}/${{ matrix.image }}:latest"

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-image-${{ matrix.image }}
          path: /tmp/e2e-images/${{ matrix.image }}.tar
          retention-days: 1
          compression-level: 0

  # ── grout kind-node image ───────────────────────────────────────────
  # Separate from build-kind-node: the node image bakes the CRA in, and a node
  # can only carry one. The grout CRA is also much more expensive to build (it
  # pulls the upstream grout image for grout/grcli/dplane_grout.so), so it is
  # only built for the job that needs it.
  build-kind-node-grout:
    name: Build kind-node image (grout)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build kind-node image (with cra-grout baked in)
        run: make e2e-build-node-image-grout

      - name: Export kind-node tarball
        run: |
          mkdir -p /tmp/e2e-images
          docker save -o /tmp/e2e-images/kind-node-grout.tar \
            "${{ env.IMG_BASE }}/das-schiff-kind-node:${{ env.KIND_NODE_VERSION }}"

      - name: Upload kind-node image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grout-image-kind-node
          path: /tmp/e2e-images/kind-node-grout.tar
          retention-days: 1
          compression-level: 0

  build-infra-images:
    name: Build infra images (nat64 + tester)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build nat64 image
        run: |
          docker build \
            -t ${{ env.IMG_BASE }}/das-schiff-nat64:latest \
            -f e2e/images/nat64/Dockerfile \
            e2e/images/nat64/

      - name: Build tester image
        run: |
          docker build \
            -t ${{ env.IMG_BASE }}/das-schiff-e2e-tester:latest \
            -f e2e/images/tester/Dockerfile \
            e2e/images/tester/

      - name: Export tarballs
        run: |
          mkdir -p /tmp/e2e-images
          docker save -o /tmp/e2e-images/das-schiff-nat64.tar \
            "${{ env.IMG_BASE }}/das-schiff-nat64:latest"
          docker save -o /tmp/e2e-images/das-schiff-e2e-tester.tar \
            "${{ env.IMG_BASE }}/das-schiff-e2e-tester:latest"

      - name: Upload infra images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-image-infra
          path: /tmp/e2e-images/*.tar
          retention-days: 1
          compression-level: 0

  build-e2e-test:
    name: Build E2E test binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build linux/amd64 E2E test binary
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go test -c -o bin/e2e.test ./e2etests

      - name: Upload E2E test binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-binary
          path: bin/e2e.test
          retention-days: 1
          compression-level: 0

  # ── E2E setup + test (uses pre-built images) ────────────────────────
  # ── Core lab: every CRA flavour x both reconciler pipelines ─────────
  # One lab per leg rather than legacy-then-intent in a single job: the intent
  # pipeline patches the operator to --enable-intent-reconciler, which disables
  # the legacy ConfigReconciler and deletes the legacy configs the legacy specs
  # need. Sharing a lab therefore forced a strict order and made a legacy
  # failure hide the intent result. Separate labs also let the two flavours run
  # concurrently instead of serialising behind one runner.
  e2e:
    name: E2E Tests (cra-${{ matrix.flavor }}, ${{ matrix.suite }})
    needs: [build-kind-node, build-kind-node-grout, build-e2e-images, build-infra-images, build-e2e-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [frr, grout]
        suite: [legacy, intent]
    env:
      E2E_CRA_FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download E2E test binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-test-binary
          path: bin

      # download-artifact drops the executable bit, and E2E_TEST_BIN opts the
      # make targets into the prebuilt binary instead of recompiling in-lab.
      - name: Restore E2E test executable permission
        run: |
          chmod +x bin/e2e.test
          echo "E2E_TEST_BIN=/repo/bin/e2e.test" >> "$GITHUB_ENV"

      - name: system-level-dependencies
        run: |
          sudo apt update
          sudo apt -y install linux-modules-extra-$(uname -r)

      # grout is a DPDK graph router: it allocates its mempools from hugepages
      # and the CRA container bind-mounts /dev/hugepages, so the pool has to
      # exist on the docker host (kind nodes share it) before the CRA starts.
      - name: Reserve hugepages
        if: matrix.flavor == 'grout'
        run: |
          sudo sysctl -w vm.nr_hugepages=2048
          grep -i hugepages_total /proc/meminfo

      # Deliberately not "e2e-image-*": that pattern matches both kind-node
      # artifacts, and they carry the same tag, so whichever loaded last would
      # decide which CRA the lab actually runs.
      - name: Download component images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/e2e-images
          pattern: e2e-image-das-schiff-*
          merge-multiple: true

      - name: Download infra images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-image-infra
          path: /tmp/e2e-images

      - name: Download kind-node image (cra-frr)
        if: matrix.flavor == 'frr'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-image-kind-node
          path: /tmp/e2e-images

      - name: Download kind-node image (cra-grout)
        if: matrix.flavor == 'grout'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grout-image-kind-node
          path: /tmp/e2e-images

      - name: Set up E2E lab
        env:
          E2E_SKIP_BUILD: "true"
          E2E_IMAGE_DIR: /tmp/e2e-images
          E2E_NODE_IMAGE: ${{ env.IMG_BASE }}/das-schiff-kind-node:${{ env.KIND_NODE_VERSION }}
        run: make e2e-up

      - name: Run E2E tests (legacy)
        if: matrix.suite == 'legacy'
        run: make e2e-test

      - name: Run E2E tests (intent)
        if: matrix.suite == 'intent'
        run: make e2e-test-intent

      - name: Collect grout debug logs
        if: failure() && matrix.flavor == 'grout'
        run: |
          mkdir -p /tmp/e2e-logs
          for node in nwop-control-plane nwop-worker nwop-worker2; do
            # grout's datapath is invisible to ip/tcpdump on the node: the
            # interfaces, addresses and routes live in the DPDK process, so
            # grcli is the only view of what the CRA actually programmed.
            for cmd in "interface show" "address show" "route show" "nexthop show"; do
              docker exec "$node" bash -c \
                "PATH=/usr/local/bin:\$PATH nerdctl -n hbr exec cra-grout grcli $cmd" \
                >> "/tmp/e2e-logs/${node}-grcli.log" 2>&1 || true
            done
            docker exec "$node" bash -c \
              'PATH=/usr/local/bin:$PATH nerdctl -n hbr logs cra-grout' \
              > "/tmp/e2e-logs/${node}-grout.log" 2>&1 || true
          done

      - name: Collect debug logs
        if: failure()
        run: |
          mkdir -p /tmp/e2e-logs
          for node in nwop-control-plane nwop-worker nwop-worker2 nwop2-worker; do
            docker logs "$node" > "/tmp/e2e-logs/${node}-docker.log" 2>&1 || true
            docker exec "$node" journalctl -u cra.service --no-pager \
              > "/tmp/e2e-logs/${node}-cra.log" 2>&1 || true
            docker exec "$node" journalctl -u kubelet.service --no-pager \
              > "/tmp/e2e-logs/${node}-kubelet.log" 2>&1 || true
            # Workload-CNI datapath: the ports live in the CRA netns, bridged
            # into the l2.<vlan> devices.
            docker exec "$node" machinectl shell cra-frr /usr/bin/ip -d link show \
              > "/tmp/e2e-logs/${node}-cra-links.log" 2>&1 || true
          done
          # Workload CNI plugin installer
          docker exec nwop-control-plane bash -c \
            'kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system logs \
              -l app=cni-workload-installer --tail=-1' \
            > /tmp/e2e-logs/cni-workload-installer.log 2>&1 || true
          # Cluster-1 state
          docker exec nwop-control-plane kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get pods -A -o wide \
            > /tmp/e2e-logs/pods.log 2>&1 || true
          docker exec nwop-control-plane kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get events -A \
            --sort-by='.lastTimestamp' > /tmp/e2e-logs/events.log 2>&1 || true
          # Per-node CRA agent logs. The agent is what renders the node's
          # NodeNetworkConfig into the datapath (grcli batches on grout, netlink
          # on frr), so a domain that never got programmed shows its error here
          # and nowhere else -- the CRA container's own log only covers startup.
          docker exec nwop-control-plane bash -c \
            'kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system logs \
              -l "app.kubernetes.io/component in (agent-cra-frr,agent-cra-grout)" \
              --all-containers --prefix --tail=-1' \
            > /tmp/e2e-logs/agent-cra-logs.log 2>&1 || true
          # Fall back to the pod name as well, so this keeps working if the
          # component labels are ever renamed.
          docker exec nwop-control-plane bash -c \
            'for POD in $(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system \
               get pods -o name | grep agent-cra); do \
               echo "=== $POD ==="; \
               kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system \
                 logs "$POD" --all-containers --tail=-1; \
             done' \
            > /tmp/e2e-logs/agent-cra-logs-bypod.log 2>&1 || true
          # Node-side link state: the macvlan fixtures use vlan.<id> netdevs that
          # netplan builds on the host trunk, and those live in the node's own
          # netns rather than the CRA's.
          for node in nwop-control-plane nwop-worker nwop-worker2; do
            docker exec "$node" bash -c \
              'ip -d link show; echo "--- addrs ---"; ip addr show; \
               echo "--- netplan ---"; ls -R /etc/netplan 2>/dev/null; \
               cat /etc/netplan/*.yaml 2>/dev/null' \
              > "/tmp/e2e-logs/${node}-node-links.log" 2>&1 || true
          done
          # Cluster-1 operator logs (current + previous crashed container)
          docker exec nwop-control-plane bash -c \
            'POD=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system \
              get pods -l app.kubernetes.io/name=network-operator -o name | head -1); \
             [ -n "$POD" ] && kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              -n kube-system logs "$POD" --all-containers' \
            > /tmp/e2e-logs/operator-logs.log 2>&1 || true
          docker exec nwop-control-plane bash -c \
            'POD=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system \
              get pods -l app.kubernetes.io/name=network-operator -o name | head -1); \
             [ -n "$POD" ] && kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              -n kube-system logs "$POD" --all-containers --previous' \
            > /tmp/e2e-logs/operator-logs-previous.log 2>&1 || true
          docker exec nwop-control-plane bash -c \
            'POD=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system \
              get pods -l app.kubernetes.io/name=network-operator -o name | head -1); \
             [ -n "$POD" ] && kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              -n kube-system describe "$POD"' \
            > /tmp/e2e-logs/operator-describe.log 2>&1 || true
          # Platform controller logs (cluster-1)
          for ctrl_label in platform-coil platform-metallb; do
            docker exec nwop-control-plane bash -c \
              "POD=\$(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system \
                get pods -l app.kubernetes.io/name=${ctrl_label} -o name | head -1); \
               [ -n \"\$POD\" ] && kubectl --kubeconfig=/etc/kubernetes/admin.conf \
                -n kube-system logs \"\$POD\" --all-containers" \
              > "/tmp/e2e-logs/${ctrl_label}-logs.log" 2>&1 || true
          done
          # Network-sync controller logs (cluster-1)
          docker exec nwop-control-plane bash -c \
            'POD=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system \
              get pods -l app=network-sync -o name | head -1); \
             [ -n "$POD" ] && kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              -n kube-system logs "$POD" --all-containers' \
            > /tmp/e2e-logs/network-sync-logs.log 2>&1 || true
          # Cluster-2 state
          docker exec nwop2-worker kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get pods -A -o wide \
            > /tmp/e2e-logs/cluster2-pods.log 2>&1 || true
          docker exec nwop2-worker kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get events -A \
            --sort-by='.lastTimestamp' > /tmp/e2e-logs/cluster2-events.log 2>&1 || true
          # Cluster-2 operator logs (current + previous crashed container)
          docker exec nwop2-worker bash -c \
            'POD=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system \
              get pods -l app.kubernetes.io/name=network-operator -o name | head -1); \
             [ -n "$POD" ] && kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              -n kube-system logs "$POD" --all-containers' \
            > /tmp/e2e-logs/cluster2-operator-logs.log 2>&1 || true
          docker exec nwop2-worker bash -c \
            'POD=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system \
              get pods -l app.kubernetes.io/name=network-operator -o name | head -1); \
             [ -n "$POD" ] && kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              -n kube-system logs "$POD" --all-containers --previous' \
            > /tmp/e2e-logs/cluster2-operator-logs-previous.log 2>&1 || true
          docker exec nwop2-worker bash -c \
            'POD=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system \
              get pods -l app.kubernetes.io/name=network-operator -o name | head -1); \
             [ -n "$POD" ] && kubectl --kubeconfig=/etc/kubernetes/admin.conf \
              -n kube-system describe "$POD"' \
            > /tmp/e2e-logs/cluster2-operator-describe.log 2>&1 || true
          # Intent CRD state (both clusters)
          for crd in vrfs networks destinations layer2attachments inbounds outbounds \
                     bgppeerings collectors trafficmirrors nodenetworkconfigs \
                     interfaceconfigs nodenetworkstatuses nodenetplanconfigs \
                     podnetworks announcementpolicies nodeworkloadports; do
            docker exec nwop-control-plane kubectl \
              --kubeconfig=/etc/kubernetes/admin.conf get "$crd" -A -o yaml \
              > "/tmp/e2e-logs/intent-${crd}.yaml" 2>&1 || true
            docker exec nwop2-worker kubectl \
              --kubeconfig=/etc/kubernetes/admin.conf get "$crd" -A -o yaml \
              > "/tmp/e2e-logs/cluster2-intent-${crd}.yaml" 2>&1 || true
          done
          # Platform-managed resources (Coil Egress, Calico IPPool, NetworkPolicies)
          docker exec nwop-control-plane kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get egresses.coil.cybozu.com -A -o yaml \
            > /tmp/e2e-logs/coil-egresses.yaml 2>&1 || true
          docker exec nwop-control-plane kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get ippools.crd.projectcalico.org -o yaml \
            > /tmp/e2e-logs/calico-ippools.yaml 2>&1 || true
          docker exec nwop-control-plane kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get networkpolicies -A -o yaml \
            > /tmp/e2e-logs/networkpolicies.yaml 2>&1 || true
          for rtr in leaf1 leaf2 dcgw1 dcgw2; do
            docker exec "clab-nwop-${rtr}" vtysh -c 'show bgp summary' \
              > "/tmp/e2e-logs/${rtr}-bgp.log" 2>&1 || true
          done
          for dcgw in dcgw1 dcgw2; do
            docker exec "clab-nwop-${dcgw}" vtysh -c 'show bgp l2vpn evpn' \
              > "/tmp/e2e-logs/${dcgw}-evpn.log" 2>&1 || true
            docker exec "clab-nwop-${dcgw}" vtysh -c 'show evpn vni' \
              > "/tmp/e2e-logs/${dcgw}-vni.log" 2>&1 || true
            docker exec "clab-nwop-${dcgw}" ip route show table all \
              > "/tmp/e2e-logs/${dcgw}-ip-routes.log" 2>&1 || true
            docker exec "clab-nwop-${dcgw}" ip -6 route show table all \
              > "/tmp/e2e-logs/${dcgw}-ip6-routes.log" 2>&1 || true
          done
          # Enable BPF stats to see program run counts
          docker exec nwop-control-plane sysctl -w kernel.bpf_stats_enabled=1 2>/dev/null || true
          sleep 2
          for node in nwop-control-plane nwop-worker nwop-worker2 nwop2-worker; do
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -m -n -- vtysh -c "show bgp l2vpn evpn"' \
              > "/tmp/e2e-logs/${node}-cra-evpn.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -m -n -- ip -6 route show table all' \
              > "/tmp/e2e-logs/${node}-cra-ip6-routes.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -m -- journalctl -u frr-cra.service --no-pager' \
              > "/tmp/e2e-logs/${node}-cra-frr-cra.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -m -n -- ip link show' \
              > "/tmp/e2e-logs/${node}-cra-links.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -m -n -- ip neigh show' \
              > "/tmp/e2e-logs/${node}-cra-neigh.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -m -n -- bridge fdb show' \
              > "/tmp/e2e-logs/${node}-cra-fdb.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               if [ -n "$CRA_PID" ]; then \
                 echo "=== bpftool link show (global) ===" ; \
                 bpftool link show 2>&1 ; \
                 echo "=== bpftool link show (CRA netns) ===" ; \
                 nsenter -t $CRA_PID -n -- bpftool link show 2>&1 ; \
                 echo "=== tc filter on VLAN interfaces ===" ; \
                 for dev in $(nsenter -t $CRA_PID -n -- ip -o link show | grep "vlan\\." | awk -F: "{print \$2}" | tr -d " "); do \
                   echo "--- $dev ---" ; \
                   nsenter -t $CRA_PID -n -- tc filter show dev "$dev" ingress 2>&1 ; \
                 done ; \
                 echo "=== bpftool net ===" ; \
                 nsenter -t $CRA_PID -n -- bpftool net show 2>&1 ; \
                 echo "=== bpftool prog ===" ; \
                 bpftool prog show 2>&1 ; \
                 echo "=== CRA frr-cra service status ===" ; \
                 nsenter -t $CRA_PID -m -- systemctl status frr-cra.service --no-pager 2>&1 ; \
               fi' \
              > "/tmp/e2e-logs/${node}-cra-bpf.log" 2>&1 || true
          done

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-debug-logs-${{ matrix.flavor }}-${{ matrix.suite }}
          path: /tmp/e2e-logs/
          retention-days: 7

      - name: Tear down E2E lab
        if: always()
        run: make e2e-down

  # ── Routed workload-CNI lab (KubeVirt VM datapath) ──────────────────
  # This lab needs its own bring-up: E2E_KUBEVIRT makes the CRA export routed
  # host routes into the underlay and installs KubeVirt + the cni-workload
  # plugin, so it cannot share the lab above.
  #
  # Run per flavour: the routed workload-CNI datapath is where the flavours
  # differ most. cra-frr puts a veth in the pod and host routes in the kernel,
  # while grout cannot adopt a moved-in veth and instead hands the CNI a net_tap
  # it created itself, with the routes living in the DPDK process.
  e2e-kubevirt:
    name: E2E Tests (cra-${{ matrix.flavor }}, routed CNI)
    needs: [build-kind-node, build-kind-node-grout, build-e2e-images, build-infra-images, build-e2e-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [frr, grout]
    env:
      E2E_KUBEVIRT: "1"
      E2E_CRA_FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download E2E test binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-test-binary
          path: bin

      # download-artifact drops the executable bit, and E2E_TEST_BIN opts the
      # make targets into the prebuilt binary instead of recompiling in-lab.
      - name: Restore E2E test executable permission
        run: |
          chmod +x bin/e2e.test
          echo "E2E_TEST_BIN=/repo/bin/e2e.test" >> "$GITHUB_ENV"

      - name: system-level-dependencies
        run: |
          sudo apt update
          sudo apt -y install linux-modules-extra-$(uname -r)

      # See the core lab: grout allocates its mempools from hugepages, so the
      # host pool has to exist before the CRA container starts.
      - name: Reserve hugepages
        if: matrix.flavor == 'grout'
        run: |
          sudo sysctl -w vm.nr_hugepages=2048
          grep -i hugepages_total /proc/meminfo

      - name: Download component images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/e2e-images
          pattern: e2e-image-das-schiff-*
          merge-multiple: true

      - name: Download infra images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-image-infra
          path: /tmp/e2e-images

      - name: Download kind-node image (cra-frr)
        if: matrix.flavor == 'frr'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-image-kind-node
          path: /tmp/e2e-images

      - name: Download kind-node image (cra-grout)
        if: matrix.flavor == 'grout'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grout-image-kind-node
          path: /tmp/e2e-images

      - name: Set up E2E lab (with KubeVirt + cni-workload)
        env:
          E2E_SKIP_BUILD: "true"
          E2E_IMAGE_DIR: /tmp/e2e-images
          E2E_NODE_IMAGE: ${{ env.IMG_BASE }}/das-schiff-kind-node:${{ env.KIND_NODE_VERSION }}
        run: make e2e-up

      - name: Run E2E tests (routed CNI)
        run: make e2e-test-kubevirt

      - name: Collect grout debug logs
        if: failure() && matrix.flavor == 'grout'
        run: |
          mkdir -p /tmp/e2e-logs
          for node in nwop-control-plane nwop-worker nwop-worker2; do
            for cmd in "interface show" "address show" "route show" "nexthop show"; do
              docker exec "$node" bash -c \
                "PATH=/usr/local/bin:\$PATH nerdctl -n hbr exec cra-grout grcli $cmd" \
                >> "/tmp/e2e-logs/${node}-grcli.log" 2>&1 || true
            done
            docker exec "$node" bash -c \
              'PATH=/usr/local/bin:$PATH nerdctl -n hbr logs cra-grout' \
              > "/tmp/e2e-logs/${node}-grout.log" 2>&1 || true
          done

      - name: Collect debug logs
        if: failure()
        run: |
          mkdir -p /tmp/e2e-logs
          for node in nwop-control-plane nwop-worker nwop-worker2; do
            docker exec "$node" journalctl -u cra.service --no-pager \
              > "/tmp/e2e-logs/${node}-cra.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -m -n -- ip -d link show' \
              > "/tmp/e2e-logs/${node}-cra-links.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -n -- ip route show table all' \
              > "/tmp/e2e-logs/${node}-cra-routes.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -n -- sh -c \
                 "ip neigh show; ip -6 neigh show; ip -d addr show"' \
              > "/tmp/e2e-logs/${node}-cra-neigh.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -m -n -- vtysh -c "show bgp summary"' \
              > "/tmp/e2e-logs/${node}-cra-bgp.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -m -n -- vtysh \
                 -c "show bgp ipv4 unicast" -c "show bgp ipv6 unicast" \
                 -c "show bgp ipv4 unicast neighbors eth1 advertised-routes" \
                 -c "show bgp ipv6 unicast neighbors eth1 advertised-routes"' \
              > "/tmp/e2e-logs/${node}-cra-bgp-tables.log" 2>&1 || true
            docker exec "$node" bash -c \
              'P=$(systemctl show cra.service -p MainPID --value 2>/dev/null); \
               CRA_PID=$(cat /proc/$P/task/*/children 2>/dev/null | head -1 | tr -d " \n"); \
               [ -n "$CRA_PID" ] && nsenter -t $CRA_PID -m -n -- vtysh -c "show running-config"' \
              > "/tmp/e2e-logs/${node}-cra-running-config.log" 2>&1 || true
          done
          docker exec nwop-control-plane kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get pods -A -o wide \
            > /tmp/e2e-logs/pods.log 2>&1 || true
          docker exec nwop-control-plane kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get events -A \
            --sort-by='.lastTimestamp' > /tmp/e2e-logs/events.log 2>&1 || true
          # Routed-CNI state: the per-node attachments and what they rendered to
          docker exec nwop-control-plane kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get nodeworkloadports -o yaml \
            > /tmp/e2e-logs/nodeworkloadports.yaml 2>&1 || true
          docker exec nwop-control-plane kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get nodenetworkconfigs -o yaml \
            > /tmp/e2e-logs/nodenetworkconfigs.yaml 2>&1 || true
          # KubeVirt state
          for res in virtualmachines virtualmachineinstances kubevirt; do
            docker exec nwop-control-plane kubectl \
              --kubeconfig=/etc/kubernetes/admin.conf get "$res" -A -o yaml \
              > "/tmp/e2e-logs/kubevirt-${res}.yaml" 2>&1 || true
          done
          # KubeVirt control plane: when a VMI never leaves Pending, the
          # launcher logs only show it waiting for a domain that virt-handler
          # was never told to define. The reason is only visible here.
          for comp in virt-controller virt-handler virt-api virt-operator; do
            docker exec nwop-control-plane kubectl \
              --kubeconfig=/etc/kubernetes/admin.conf -n kubevirt logs \
              -l "kubevirt.io=${comp}" --tail=-1 --prefix \
              > "/tmp/e2e-logs/kubevirt-${comp}.log" 2>&1 || true
          done
          # kubevirt.io/schedulable and the virt-handler heartbeat live here.
          docker exec nwop-control-plane kubectl \
            --kubeconfig=/etc/kubernetes/admin.conf get nodes -o yaml \
            > /tmp/e2e-logs/kubevirt-nodes.yaml 2>&1 || true
          # kubectl logs has no -A/--all-namespaces, so resolve the namespace
          # from the pod first. --previous is collected too: when the launcher
          # crashes, the current container has no useful output.
          docker exec nwop-control-plane bash -c \
            'set -- $(kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -A \
               -l kubevirt.io=virt-launcher \
               -o jsonpath="{.items[0].metadata.namespace} {.items[0].metadata.name}"); \
             [ -n "$2" ] || exit 0; \
             kubectl --kubeconfig=/etc/kubernetes/admin.conf -n "$1" \
               describe pod "$2"; \
             kubectl --kubeconfig=/etc/kubernetes/admin.conf -n "$1" logs \
               "$2" --all-containers --tail=-1; \
             kubectl --kubeconfig=/etc/kubernetes/admin.conf -n "$1" logs \
               "$2" --all-containers --previous --tail=-1' \
            > /tmp/e2e-logs/virt-launcher-logs.log 2>&1 || true
          docker exec nwop-control-plane bash -c \
            'set -- $(kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -A \
               -l kubevirt.io=virt-launcher \
               -o jsonpath="{.items[0].metadata.namespace} {.items[0].metadata.name}"); \
             [ -n "$2" ] && kubectl --kubeconfig=/etc/kubernetes/admin.conf \
               -n "$1" exec "$2" -c compute -- sh -c \
               "ip addr show; ip route show; ip neigh show; ip -6 neigh show"' \
            > /tmp/e2e-logs/virt-launcher-netns.log 2>&1 || true
          # Guest console: shows the addresses cloud-init actually configured.
          docker exec nwop-control-plane bash -c \
            'set -- $(kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -A \
               -l kubevirt.io=virt-launcher \
               -o jsonpath="{.items[0].metadata.namespace} {.items[0].metadata.name}"); \
             [ -n "$2" ] && kubectl --kubeconfig=/etc/kubernetes/admin.conf \
               -n "$1" logs "$2" -c guest-console-log --tail=-1' \
            > /tmp/e2e-logs/virt-launcher-console.log 2>&1 || true
          docker exec nwop-control-plane bash -c \
            'kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system logs \
              -l app=cni-workload-installer --tail=-1' \
            > /tmp/e2e-logs/cni-workload-installer.log 2>&1 || true
          # Fabric view of the routed host routes
          for rtr in leaf1 leaf2 dcgw1 dcgw2; do
            docker exec "clab-nwop-${rtr}" vtysh -c 'show bgp summary' \
              > "/tmp/e2e-logs/${rtr}-bgp.log" 2>&1 || true
            docker exec "clab-nwop-${rtr}" ip route show table all \
              > "/tmp/e2e-logs/${rtr}-ip-routes.log" 2>&1 || true
          done

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-kubevirt-debug-logs-${{ matrix.flavor }}
          path: /tmp/e2e-logs/
          retention-days: 7

      - name: Tear down E2E lab
        if: always()
        run: make e2e-down

  # ── grout vhost-user KubeVirt datapath lab ──────────────────────────
  # The only job that exercises the grout flavour, and the only one that runs a
  # VM whose NIC is a DPDK vhost-user socket rather than a kernel device. It
  # needs its own lab for three reasons: a different CRA is baked into the node
  # image, the node must have hugepages before kubelet starts, and the fixture
  # switches the operator to the intent reconciler (an L2 attach binds by
  # attachmentRef, which only the intent builder stamps).
  e2e-kubevirt-vhostuser:
    name: E2E Tests (grout vhost-user KubeVirt)
    needs: [build-kind-node-grout, build-e2e-images, build-infra-images, build-e2e-test]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      E2E_KUBEVIRT: "1"
      E2E_KUBEVIRT_VHOSTUSER: "1"
      E2E_CRA_FLAVOR: grout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download E2E test binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-test-binary
          path: bin

      # download-artifact drops the executable bit, and E2E_TEST_BIN opts the
      # make targets into the prebuilt binary instead of recompiling in-lab.
      - name: Restore E2E test executable permission
        run: |
          chmod +x bin/e2e.test
          echo "E2E_TEST_BIN=/repo/bin/e2e.test" >> "$GITHUB_ENV"

      - name: system-level-dependencies
        run: |
          sudo apt update
          sudo apt -y install linux-modules-extra-$(uname -r)

      # vhost-user maps the guest's memory into the fast path, so the guest has
      # to be hugepage-backed. kind nodes share the host's hugetlb pool and
      # kubelet only reports the capacity it saw at start, so this must happen
      # before the cluster is created. 2048 x 2MiB = 4GiB covers the 1GiB guest,
      # grout's mempools on three nodes and slack; the runner has 16GiB total,
      # so reserving much more would starve the rest of the lab.
      - name: Reserve hugepages
        run: |
          sudo sysctl -w vm.nr_hugepages=2048
          grep -i hugepages_total /proc/meminfo

      # Deliberately not "e2e-image-*": that pattern also matches the cra-frr
      # kind-node artifact, and both node images carry the same tag, so
      # whichever loaded last would decide which CRA the lab runs.
      - name: Download component images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/e2e-images
          pattern: e2e-image-das-schiff-*
          merge-multiple: true

      - name: Download infra images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-image-infra
          path: /tmp/e2e-images

      - name: Download grout kind-node image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grout-image-kind-node
          path: /tmp/e2e-images

      - name: Set up E2E lab (grout + KubeVirt + vhost-user)
        env:
          E2E_SKIP_BUILD: "true"
          E2E_IMAGE_DIR: /tmp/e2e-images
          E2E_NODE_IMAGE: ${{ env.IMG_BASE }}/das-schiff-kind-node:${{ env.KIND_NODE_VERSION }}
        run: make e2e-up

      - name: Run E2E tests (grout vhost-user KubeVirt)
        run: make e2e-test-kubevirt-vhostuser

      - name: Collect debug logs
        if: failure()
        run: |
          mkdir -p /tmp/e2e-logs
          K="kubectl --kubeconfig=/etc/kubernetes/admin.conf"
          for node in nwop-control-plane nwop-worker nwop-worker2; do
            # grout state: the CRA is a nerdctl container, and its datapath is
            # invisible to ip/tcpdump on the node, so grcli is the only view.
            for cmd in "interface show" "address show" "route show" "nexthop show"; do
              docker exec "$node" bash -c \
                "PATH=/usr/local/bin:\$PATH nerdctl -n hbr exec cra-grout grcli $cmd" \
                >> "/tmp/e2e-logs/${node}-grcli.log" 2>&1 || true
            done
            docker exec "$node" journalctl -u cra.service --no-pager \
              > "/tmp/e2e-logs/${node}-cra.log" 2>&1 || true
            docker exec "$node" ls -lR /run/vsr-vhost-user /run/vsr-virtio-user \
              > "/tmp/e2e-logs/${node}-sockets.log" 2>&1 || true
          done
          docker exec nwop-control-plane bash -c \
            "$K get nodenetworkconfig -o yaml" \
            > /tmp/e2e-logs/nodenetworkconfigs.yaml 2>&1 || true
          docker exec nwop-control-plane bash -c \
            "$K get nodeworkloadports -o yaml" \
            > /tmp/e2e-logs/nodeworkloadports.yaml 2>&1 || true
          docker exec nwop-control-plane bash -c \
            "$K get layer2attachments,networks -A -o yaml" \
            > /tmp/e2e-logs/intent-configs.yaml 2>&1 || true
          docker exec nwop-control-plane bash -c \
            "$K -n kube-system logs -l app=vhostuser-device-plugin --tail=-1" \
            > /tmp/e2e-logs/device-plugin.log 2>&1 || true
          # The hook runs as a sidecar in the launcher, so its log is the only
          # evidence of what the domain looked like before libvirt saw it.
          docker exec nwop-control-plane bash -c \
            "$K -n default logs -l kubevirt.io/vm=grout-vhostuser-vm -c hook-sidecar-0 --tail=-1" \
            > /tmp/e2e-logs/vhostuser-hook.log 2>&1 || true
          docker exec nwop-control-plane bash -c \
            "$K -n default logs -l kubevirt.io/vm=grout-vhostuser-vm -c guest-console-log --tail=-1" \
            > /tmp/e2e-logs/guest-console.log 2>&1 || true
          docker exec nwop-control-plane bash -c \
            "$K -n default get vmi,pods -o yaml" \
            > /tmp/e2e-logs/vmi.yaml 2>&1 || true
          # The CRA agent renders the NodeNetworkConfig into grout; when a
          # domain is never programmed, its grcli error appears only here.
          docker exec nwop-control-plane bash -c \
            "$K -n kube-system logs \
              -l 'app.kubernetes.io/component in (agent-cra-frr,agent-cra-grout)' \
              --all-containers --prefix --tail=-1" \
            > /tmp/e2e-logs/agent-cra-logs.log 2>&1 || true
          # A VMI that never leaves Pending was never advanced by virt-controller,
          # so the launcher only ever shows itself waiting for a domain.
          for comp in virt-controller virt-handler virt-api virt-operator; do
            docker exec nwop-control-plane bash -c \
              "$K -n kubevirt logs -l kubevirt.io=${comp} --tail=-1 --prefix" \
              > "/tmp/e2e-logs/kubevirt-${comp}.log" 2>&1 || true
          done
          docker exec nwop-control-plane bash -c "$K get nodes -o yaml" \
            > /tmp/e2e-logs/kubevirt-nodes.yaml 2>&1 || true
          docker exec nwop-control-plane bash -c \
            "$K get events -A --sort-by=.lastTimestamp" \
            > /tmp/e2e-logs/events.log 2>&1 || true
          for node in nwop-control-plane nwop-worker nwop-worker2; do
            docker exec "$node" bash -c \
              'ip -d link show; echo "--- addrs ---"; ip addr show' \
              > "/tmp/e2e-logs/${node}-node-links.log" 2>&1 || true
          done

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-kubevirt-vhostuser-debug-logs
          path: /tmp/e2e-logs/
          retention-days: 7

      - name: Tear down E2E lab
        if: always()
        run: make e2e-down
